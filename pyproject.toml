[project]
name = "advent_of_code_20XX"
version = "1.0.0"
description = "Advent of Code 20XX solutions in Python"
license = {file = "LICENSE"}
authors = [
  {name = "Valentin PORCHET", email = "valentin.porchet@proton.me"}
]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "typer==0.29.*",
    "pyinstrument==5.1.*",
    "python-dotenv==1.2.*",
    "httpx==0.28.*",
]

[dependency-groups]
dev = [
    "ruff==0.17.*",
    "pyrefly==1.4.*",
    "complexipy==8.3.*",
]

[tool.ruff]
# Assume Python 3.15
target-version = "py315"

[tool.pyrefly]
preset = "strict"
